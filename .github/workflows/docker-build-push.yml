name: Build and push Docker image

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "k8s/base/deployment.yaml"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from k8s manifest
        id: get_version
        run: |
          # Извлекаем значение image, заменяем двоеточие на пробел и берем последнее слово (тег)
          VERSION=$(grep -oP 'image:\s*docker\.io/maks83/0root-demo-app:\K\S+' k8s/base/deployment.yaml)
          echo "Parsed version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/0root-demo-app
          tags: |
            type=raw,value=${{ steps.get_version.outputs.version }}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

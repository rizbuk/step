apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 0root-demo-app
  namespace: demo
  labels:
    app.kubernetes.io/name: 0root-demo-app
    app.kubernetes.io/part-of: 0root-demo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: app.0root-demo.devops1.0root.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
